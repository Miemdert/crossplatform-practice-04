<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- viewport обязателен для адаптивности и критериев установки PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PWA «Заметка»</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d47a1" />
  <!-- Подключаем общий CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>PWA «Заметка»</h1>
    <nav>
      <button id="news-button" class="nav-btn">Новости</button>
    </nav>
  </header>
  <main>
    <textarea id="note" rows="8" cols="40" placeholder="Введите текст — он сохранится локально"></textarea>
    <div class="actions">
      <button id="wasm-button" class="action-btn">Вычислить квадрат (Wasm)</button>
      <p id="wasm-result"></p>
    </div>
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 PWA Note</p>
  </footer>
  <script>
    // 1. Локальное сохранение текста (простейшее внутреннее хранилище)
    let wasmExports = null;
    fetch('./function.wasm')
      .then(r => r.arrayBuffer())
      .then(bytes => WebAssembly.instantiate(bytes))
      .then(obj => { wasmExports = obj.instance.exports; })
      .catch(err => console.error('Ошибка загрузки Wasm:', err));

    const area = document.getElementById('note');
    area.value = localStorage.getItem('note') || '';
    area.addEventListener('input', () => localStorage.setItem('note', area.value));

    const wasmButton = document.getElementById('wasm-button');
    const wasmResult = document.getElementById('wasm-result');
    wasmButton.addEventListener('click', () => {
      if (wasmExports) {
        wasmResult.textContent = wasmExports.square(7);
      } else {
        wasmResult.textContent = 'Wasm модуль не загружен.';
      }
    });

    // Переход к странице новостей
    document.getElementById('news-button').addEventListener('click', () => {
      location.href = 'news.html';
    });

    // 2. Регистрация Service Worker — только в безопасном контексте (HTTPS или localhost)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker зарегистрирован'))
        .catch(err => console.error('Ошибка регистрации SW:', err));
    }
  </script>
</body>
</html>
